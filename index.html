<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            /* Fuerza a la tarjeta gráfica del celular a renderizar la imagen del video */
            transform: translateZ(0);
            will-change: transform;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        video.muted = false;
        
        // Forzar reproducción inmediata
        video.play().catch(e => {
            console.log("Esperando interacción para reproducir");
        });

        // Asegurar que si se toca la pantalla arranque con imagen y sonido
        document.addEventListener('click', () => {
            video.muted = false;
            video.play();
        });
    </script>
</body>
</html>
