<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill; /* Fuerza a que el video cubra todo el espacio transparente */
            background: transparent;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        video.play().catch(e => console.log(e));
        
        // Si al tocar la pantalla arranca, aseguramos la reproducción
        document.addEventListener('click', () => {
            video.muted = false;
            video.play();
        });
    </script>
</body>
</html>
