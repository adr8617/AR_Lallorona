<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            display: block;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        // Fuerza el inicio automático
        video.play().catch(() => {});
        
        // Asegura que si CameraFi pausa el renderizado, lo reactive
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                video.play();
            }
        });
    </script>
</body>
</html>
