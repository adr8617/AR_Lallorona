<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #000000; /* Fondo negro sólido temporal para forzar que el video se dibuje a color */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no suporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        video.muted = false; // Activamos el audio que ya sabemos que funciona
        video.play().catch(e => console.log(e));
        
        document.addEventListener('click', () => {
            video.muted = false;
            video.play();
        });
    </script>
</body>
</html>
