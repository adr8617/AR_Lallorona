<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent !important;
        background: transparent !important;
        overflow: hidden;
    }
    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent !important;
    }
</style>

</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="llorona.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        // Forzar reproducción automática por si el overlay de CameraFi lo pausa
        document.addEventListener("DOMContentLoaded", function() {
            var vid = document.getElementById("videoLlorona");
            vid.play().catch(function(error) {
                console.log("Autoplay bloqueado, reintentando...");
            });
        });
    </script>
</body>
</html>
