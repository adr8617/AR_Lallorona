<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent; /* Fondo transparente real */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Esto vuelve transparente todo lo que sea blanco en el video */
            mix-blend-mode: multiply; 
            filter: contrast(120%);
            background: transparent;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        video.play().catch(() => {});
    </script>
</body>
</html>
