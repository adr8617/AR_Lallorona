<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="134.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        // Fuerza la reproducción automática de inmediato para CameraFi
        const video = document.getElementById('videoLlorona');
        video.play().catch(error => {
            console.log("Reproducción automática iniciada con interacción");
        });
        
        // Intenta reproducir de nuevo si hay un toque en cualquier parte
        document.body.addEventListener('click', () => {
            video.play();
        }, { once: true });
    </script>
</body>
</html>
