<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay muted loop playsinline webkit-playsinline>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        
        // Forzar reproducción al cargar
        video.play().catch(e => console.log(e));

        // Si CameraFi bloquea el inicio, se reproduce en cuanto toques cualquier parte del recuadro
        document.addEventListener('click', () => {
            video.muted = false; // Activa el sonido al primer toque
            video.play();
        });
    </script>
</body>
</html>
