<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white; /* Fondo blanco sólido para comprobar visualización */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Usamos un contenedor de video estilizado y visible a fuerzas */
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            background: black; /* Fondo negro temporal en el video para ver dónde está ubicado */
        }
    </style>
</head>
<body>
    <video id="videoLlorona" autoplay loop playsinline webkit-playsinline controls>
        <source src="135.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const video = document.getElementById('videoLlorona');
        video.muted = false;
        video.play();
    </script>
</body>
</html>
