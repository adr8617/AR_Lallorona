<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay La Llorona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="videoLlorona">
        <source src="llorona.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>

    <script>
        const vid = document.getElementById("videoLlorona");

        // Forzar reproducción y reinicio al cargar la página en la app
        window.addEventListener('load', function() {
            vid.currentTime = 0;
            vid.play().catch(function(error) {
                console.log("Autoplay bloqueado o reintentando:", error);
            });
        });

        // Garantizar bucle infinito continuo
        vid.addEventListener("ended", function() {
            vid.currentTime = 0;
            vid.play();
        });
    </script>
</body>
</html>
