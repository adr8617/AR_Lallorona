<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara con Chroma Key Multi-Video</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #contenedor-principal { position: relative; width: 100vw; height: 100vh; max-width: 1280px; max-height: 720px; }
        
        /* El panel de controles flotante */
        #panel-controles { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        #panel-controles select { padding: 10px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; }
        
        /* BOTÓN DE INICIO GIGANTE */
        #pantalla-inicio { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #btn-iniciar { background-color: #28a745; color: white; font-weight: bold; font-size: 24px; padding: 20px 40px; border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #mensaje-error { color: #ff4444; margin-top: 20px; text-align: center; max-width: 80%; }

        /* Capas de video */
        #video-camara { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background-color: #333; }
        #video-verde { display: none; }
        #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>
    
    <!-- PANTALLA DE INICIO (Obligatoria para móviles) -->
    <div id="pantalla-inicio">
        <button id="btn-iniciar">TOCA AQUÍ PARA ENCENDER CÁMARA</button>
        <p id="mensaje-error"></p>
    </div>

    <div id="contenedor-principal">
        <div id="panel-controles" style="display: none;">
            <select id="selector-video">
                <option value="llorona.mp4">Efecto: La Llorona</option>
                <!-- Agrega aquí más opciones cuando subas más videos -->
            </select>
        </div>
        <video id="video-camara" autoplay playsinline muted></video>
        <video id="video-verde" loop muted playsinline crossorigin="anonymous"></video>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <script>
        const videoCamara = document.getElementById('video-camara');
        const videoVerde = document.getElementById('video-verde');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const btnIniciar = document.getElementById('btn-iniciar');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const panelControles = document.getElementById('panel-controles');
        const selectorVideo = document.getElementById('selector-video');
        const mensajeError = document.getElementById('mensaje-error');
        
        let procesando = false;

        async function iniciar() {
            mensajeError.innerText = "Solicitando permisos...";
            try {
                // Forzamos la petición de video
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } // Pide cámara frontal
                });
                
                videoCamara.srcObject = stream;
                
                // Esperamos a que la cámara arranque
                videoCamara.onloadedmetadata = () => {
                    videoCamara.play();
                    
                    // Ocultamos inicio, mostramos controles
                    pantallaInicio.style.display = 'none';
                    panelControles.style.display = 'flex';
                    
                    // Cargamos Llorona
                    videoVerde.src = selectorVideo.value;
                    videoVerde.play();
                };

            } catch (err) {
                console.error(err);
                if (err.name === 'NotAllowedError') {
                    mensajeError.innerText = "Error: Denegaste el permiso de la cámara. Ve a la configuración de Chrome y permítelo.";
                } else if (err.name === 'NotFoundError') {
                    mensajeError.innerText = "Error: No se detectó ninguna cámara en tu celular.";
                } else if (err.location && err.protocol !== "https:") {
                    mensajeError.innerText = "Error de seguridad: La página no está cargando con HTTPS.";
                } else {
                    mensajeError.innerText = "Error inesperado: " + err.message;
                }
            }
        }

        selectorVideo.addEventListener('change', (evento) => {
            videoVerde.src = evento.target.value; 
            videoVerde.play(); 
        });

        videoVerde.addEventListener('loadedmetadata', () => {
            canvas.width = videoVerde.videoWidth;
            canvas.height = videoVerde.videoHeight;
            if (!procesando) {
                procesando = true;
                procesarChromaKey();
            }
        });

        function procesarChromaKey() {
            if (!videoVerde.paused && !videoVerde.ended) {
                ctx.drawImage(videoVerde, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let totalPixeles = frame.data.length / 4;

                for (let i = 0; i < totalPixeles; i++) {
                    let r = frame.data[i * 4 + 0];
                    let g = frame.data[i * 4 + 1];
                    let b = frame.data[i * 4 + 2];

                    if (g > 90 && r < 110 && b < 110) {
                        frame.data[i * 4 + 3] = 0; 
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            requestAnimationFrame(procesarChromaKey);
        }

        btnIniciar.addEventListener('click', iniciar);
    </script>
</body>
</html>
