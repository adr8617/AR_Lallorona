<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio AR: Efectos Dinámicos</title>
    <style>
        /* ==========================================================================
           1. ESTILOS GENERALES Y RESETEO
           ========================================================================== */
        body { 
            margin: 0; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        
        #contenedor-principal { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
            background: #000;
        }
        
        /* ==========================================================================
           2. PANTALLA DE INICIO (Desbloqueo de políticas de audio/video)
           ========================================================================== */
        #pantalla-inicio { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.95); 
            z-index: 999; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        #btn-iniciar { 
            background-color: #28a745; 
            color: white; 
            font-weight: bold; 
            font-size: 20px; 
            padding: 15px 30px; 
            border-radius: 12px; 
            border: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            cursor: pointer;
        }
        #mensaje-error { 
            color: #ff4444; 
            margin-top: 20px; 
            text-align: center; 
            max-width: 80%; 
            font-size: 14px;
        }

        /* ==========================================================================
           3. PANEL DE CONTROLES Y BOTÓN CIRCULAR LATERAL IZQUIERDO
           ========================================================================== */
        #panel-controles { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 100; 
            display: flex; 
            align-items: center;
        }

        /* Botón circular discreto, transparente con borde negro */
        #btn-menu-circular {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid #000000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
            transition: background-color 0.2s;
        }
        #btn-menu-circular:active {
            background-color: rgba(0, 0, 0, 0.6);
        }

        /* Icono interno del botón */
        #btn-menu-circular::after {
            content: "⚙️";
            font-size: 16px;
        }

        /* Tooltip / Pop-up emergente */
        #tooltip-texto {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #btn-menu-circular:hover #tooltip-texto,
        #btn-menu-circular.activo-tactil #tooltip-texto {
            opacity: 1;
            visibility: visible;
        }

        /* Desplegable de selección oculto hasta presionar el botón */
        #selector-video-wrapper {
            display: none;
            position: absolute;
            left: 48px;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        #selector-video { 
            padding: 8px; 
            font-size: 14px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222;
            color: #fff;
            cursor: pointer; 
        }
        
        /* Botón oculto real de archivo para disparar el explorador del celular */
        #input-archivo-oculto {
            display: none;
        }

        #btn-agregar-archivo {
            background: #1b4d3e;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        #btn-agregar-archivo:hover {
            background: #28a745;
        }

        /* ==========================================================================
           4. SELECTOR DE COLOR CHROMA KEY (Derecha superior)
           ========================================================================== */
        #btn-color { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            width: 25px; 
            height: 25px; 
            border-radius: 50%; 
            background-color: #00ff00; 
            cursor: pointer; 
            z-index: 102; 
            opacity: 0.3; 
            border: 2px solid white; 
            box-shadow: 0 0 5px rgba(0,0,0,0.8); 
            transition: opacity 0.2s; 
        }
        #menu-colores { 
            display: none; 
            position: absolute; 
            top: 55px; 
            right: 20px; 
            background: rgba(0,0,0,0.8); 
            padding: 10px; 
            border-radius: 8px; 
            z-index: 101; 
            flex-direction: column; 
            gap: 12px; 
        }
        .opcion-color { 
            width: 25px; 
            height: 25px; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid transparent; 
        }

        /* ==========================================================================
           5. CAPAS MULTIMEDIA (Cámara, Video Chroma, GIFs)
           ========================================================================== */
        #video-camara { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
            background-color: #000; 
        }
        #video-multimedia { display: none; }
        
        #canvas-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            z-index: 2; 
            pointer-events: none; 
            display: none; 
        }
        
        #imagen-gif { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            z-index: 2; 
            pointer-events: none; 
            display: none; 
        }
    </style>
</head>
<body>
    
    <!-- Pantalla inicial de desbloqueo multimedia -->
    <div id="pantalla-inicio">
        <button id="btn-iniciar">TOCA AQUÍ PARA INICIAR</button>
        <p id="mensaje-error"></p>
    </div>

    <div id="contenedor-principal">
        
        <!-- Panel de control flotante izquierdo -->
        <div id="panel-controles" style="display: none;">
            <div id="btn-menu-circular">
                <span id="tooltip-texto">Menú de Efectos</span>
                <div id="selector-video-wrapper">
                    <select id="selector-video"></select>
                    <button id="btn-agregar-archivo">➕ Agregar archivo local</button>
                </div>
            </div>
        </div>

        <!-- Input de archivo invisible que se activa al pulsar "Agregar archivo local" -->
        <input type="file" id="input-archivo-oculto" accept="video/mp4,image/gif">

        <!-- Selector de color Chroma Key -->
        <div id="btn-color"></div>
        <div id="menu-colores">
            <div class="opcion-color" data-color="verde" style="background-color: #00ff00;"></div>
            <div class="opcion-color" data-color="azul" style="background-color: #0000ff;"></div>
            <div class="opcion-color" data-color="negro" style="background-color: #111; border: 1px solid #777;"></div>
        </div>

        <!-- Elementos visuales -->
        <video id="video-camara" autoplay playsinline muted></video>
        <video id="video-multimedia" loop playsinline crossorigin="anonymous"></video>
        <canvas id="canvas-overlay"></canvas>
        <img id="imagen-gif" src="" alt="GIF transparente">
    </div>

    <script>
        /* ==========================================================================
           6. GESTIÓN DE MEMORIA LOCAL (Local Database)
           ========================================================================== */
        // Base predeterminada inicial obligatoria (La Llorona por defecto)
        const MULTIMEDIA_DEFAULT = [
            {
                nombre: "Video Chroma: La Llorona",
                archivo: "llorona.mp4",
                tipo: "video"
            }
        ];

        // Cargar desde la memoria del teléfono o inicializar con el valor por defecto
        function obtenerBaseDatos() {
            const guardado = localStorage.getItem('efectos_ar_db');
            if (guardado) {
                try { return JSON.parse(guardado); } catch(e) { return MULTIMEDIA_DEFAULT; }
            }
            return MULTIMEDIA_DEFAULT;
        }

        function guardarBaseDatos(db) {
            localStorage.setItem('efectos_ar_db', JSON.stringify(db));
        }

        let listaMultimedia = obtenerBaseDatos();

        /* ==========================================================================
           7. LÓGICA DE INTERFAZ Y REPRODUCCIÓN
           ========================================================================== */
        const videoCamara = document.getElementById('video-camara');
        const videoMultimedia = document.getElementById('video-multimedia');
        const canvas = document.getElementById('canvas-overlay');
        const imagenGif = document.getElementById('imagen-gif');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const btnIniciar = document.getElementById('btn-iniciar');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const panelControles = document.getElementById('panel-controles');
        const selectorVideo = document.getElementById('selector-video');
        const mensajeError = document.getElementById('mensaje-error');
        
        const btnMenuCircular = document.getElementById('btn-menu-circular');
        const selectorVideoWrapper = document.getElementById('selector-video-wrapper');
        const btnAgregarArchivo = document.getElementById('btn-agregar-archivo');
        const inputArchivoOculto = document.getElementById('input-archivo-oculto');
        
        const btnColor = document.getElementById('btn-color');
        const menuColores = document.getElementById('menu-colores');
        const opcionesColor = document.querySelectorAll('.opcion-color');
        
        let colorFiltro = 'verde';
        let procesando = false;
        let tipoActual = 'video';

        // Rellenar menú desplegable dinámicamente con la memoria local
        function actualizarSelect() {
            selectorVideo.innerHTML = "";
            listaMultimedia.forEach((item, index) => {
                let option = document.createElement('option');
                option.value = item.archivo;
                option.setAttribute('data-tipo', item.tipo);
                option.innerText = item.nombre;
                selectorVideo.appendChild(option);
            });
        }

        // Mostrar u ocultar el menú desplegable al hacer clic en el botón circular izquierdo
        btnMenuCircular.addEventListener('click', (e) => {
            e.stopPropagation();
            const estaVisible = selectorVideoWrapper.style.display === 'flex';
            selectorVideoWrapper.style.display = estaVisible ? 'none' : 'flex';
            btnMenuCircular.classList.toggle('activo-tactil', !estaVisible);
        });

        document.addEventListener('click', () => {
            selectorVideoWrapper.style.display = 'none';
            btnMenuCircular.classList.remove('activo-tactil');
            menuColores.style.display = 'none';
            btnColor.style.opacity = '0.3';
        });

        selectorVideoWrapper.addEventListener('click', (e) => e.stopPropagation());

        // Al hacer clic en el botón de "Agregar archivo local" dentro del menú desplegable
        btnAgregarArchivo.addEventListener('click', (e) => {
            e.stopPropagation();
            inputArchivoOculto.click(); // Abre el explorador de archivos del teléfono
        });

        // Cuando el usuario selecciona un archivo nuevo de su dispositivo
        inputArchivoOculto.addEventListener('change', (e) => {
            const archivo = e.target.files[0];
            if (!archivo) return;

            const nombreArchivo = archivo.name;
            const esGif = nombreArchivo.toLowerCase().endsWith('.gif');
            const tipoDetectado = esGif ? 'gif' : 'video';

            // Pide el nombre descriptivo que aparecerá en el pop-up/menú desplegable
            let descripcionCustom = prompt("Escribe el nombre descriptivo para este efecto (ej. Murciélago Volando):", nombreArchivo);
            if (!descripcionCustom || descripcionCustom.trim() === "") {
                descripcionCustom = nombreArchivo;
            }

            // Creamos la ruta de objeto local temporal para reproducirlo inmediatamente
            const urlLocal = URL.createObjectURL(archivo);

            // Guardamos en la "base de datos" local del navegador
            const nuevoEfecto = {
                nombre: descripcionCustom,
                archivo: urlLocal,
                tipo: tipoDetectado
            };

            listaMultimedia.push(nuevoEfecto);
            guardarBaseDatos(listaMultimedia);
            actualizarSelect();

            // Seleccionamos automáticamente el nuevo elemento recién creado
            selectorVideo.selectedIndex = selectorVideo.options.length - 1;
            cargarArchivoSeleccionado();
            selectorVideoWrapper.style.display = 'none';
        });

        // Control del menú de colores Chroma Key
        btnColor.addEventListener('click', (e) => {
            e.stopPropagation();
            const estaAbierto = menuColores.style.display === 'flex';
            menuColores.style.display = estaAbierto ? 'none' : 'flex';
            btnColor.style.opacity = estaAbierto ? '0.3' : '1';
        });

        opcionesColor.forEach(opcion => {
            opcion.addEventListener('click', (e) => {
                colorFiltro = e.target.getAttribute('data-color');
                btnColor.style.backgroundColor = getComputedStyle(e.target).backgroundColor;
                menuColores.style.display = 'none';
                btnColor.style.opacity = '0.3';
            });
        });

        // Función inteligente para cargar el archivo activo en pantalla
        function cargarArchivoSeleccionado() {
            if (selectorVideo.options.length === 0) return;
            const selectedOption = selectorVideo.options[selectorVideo.selectedIndex];
            const archivoUrl = selectedOption.value;
            tipoActual = selectedOption.getAttribute('data-tipo');

            if (tipoActual === 'gif') {
                videoMultimedia.pause();
                canvas.style.display = 'none';
                btnColor.style.display = 'none';
                
                imagenGif.src = archivoUrl;
                imagenGif.style.display = 'block';
            } else {
                imagenGif.style.display = 'none';
                btnColor.style.display = 'block';
                canvas.style.display = 'block';
                
                videoMultimedia.src = archivoUrl;
                videoMultimedia.muted = false; // Mantiene el sonido original del MP4
                videoMultimedia.play().catch(e => console.log("Audio autoreproducido pendiente de interacción.", e));
            }
        }

        selectorVideo.addEventListener('change', cargarArchivoSeleccionado);

        // Inicializar permisos de cámara y arranque principal
        async function iniciarExperiencia() {
            mensajeError.innerText = "Solicitando permisos de cámara...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false 
                });
                
                videoCamara.srcObject = stream;
                
                videoCamara.onloadedmetadata = () => {
                    videoCamara.play();
                    pantallaInicio.style.display = 'none';
                    panelControles.style.display = 'flex';
                    
                    // Activar pantalla completa si el navegador lo permite
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }

                    actualizarSelect();
                    cargarArchivoSeleccionado();
                };
            } catch (err) {
                console.error(err);
                mensajeError.innerText = "Error: No se pudo acceder a la cámara o permisos denegados.";
            }
        }

        // Motor Chroma Key en tiempo real por fotogramas
        videoMultimedia.addEventListener('loadedmetadata', () => {
            canvas.width = videoMultimedia.videoWidth;
            canvas.height = videoMultimedia.videoHeight;
            if (!procesando) {
                procesando = true;
                procesarChromaKey();
            }
        });

        function procesarChromaKey() {
            if (tipoActual === 'video' && !videoMultimedia.paused && !videoMultimedia.ended) {
                ctx.drawImage(videoMultimedia, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let totalPixeles = frame.data.length / 4;

                for (let i = 0; i < totalPixeles; i++) {
                    let r = frame.data[i * 4 + 0];
                    let g = frame.data[i * 4 + 1];
                    let b = frame.data[i * 4 + 2];

                    if (colorFiltro === 'verde') {
                        if (g > 90 && r < 110 && b < 110) frame.data[i * 4 + 3] = 0;
                    } else if (colorFiltro === 'azul') {
                        if (b > 90 && r < 110 && g < 110) frame.data[i * 4 + 3] = 0;
                    } else if (colorFiltro === 'negro') {
                        if (r < 50 && g < 50 && b < 50) frame.data[i * 4 + 3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            requestAnimationFrame(procesarChromaKey);
        }

        btnIniciar.addEventListener('click', iniciarExperiencia);
    </script>
</body>
</html>
