<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio AR: Efectos Dinámicos</title>
<style>
body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
#contenedor-principal { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
#pantalla-inicio { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
#btn-iniciar { background-color: #28a745; color: white; font-weight: bold; font-size: 20px; padding: 15px 30px; border-radius: 12px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
#mensaje-error { color: #ff4444; margin-top: 20px; text-align: center; max-width: 80%; font-size: 14px; }

#panel-controles { position: absolute; top: 20px; left: 20px; z-index: 5000; display: flex; gap: 10px; align-items: center; }
.btn-flotante { width: 36px; height: 36px; border-radius: 50%; background-color: rgba(0, 0, 0, 0.4); border: 2px solid #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); position: relative; transition: background-color 0.2s; }
.btn-flotante:active { background-color: rgba(0, 0, 0, 0.7); }

#btn-menu-circular::after { content: "⚙️"; font-size: 16px; }
#btn-mover-efecto::after { content: "✋"; font-size: 16px; }
#btn-mover-efecto.activo { background-color: #28a745; border-color: #fff; }

/* Botón de Grabación (Círculo rojo dinámico) */
#btn-grabar { width: 36px; height: 36px; border-radius: 50%; background-color: rgba(255, 0, 0, 0.5); border: 2px solid #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); position: relative; transition: background-color 0.2s; }
#btn-grabar::after { content: "🔴"; font-size: 14px; }
#btn-grabar.grabando { background-color: rgba(255, 0, 0, 0.9); animation: parpadeo 1s infinite; }
@keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

#tooltip-texto { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
#btn-menu-circular:hover #tooltip-texto, #btn-menu-circular.activo-tactil #tooltip-texto { opacity: 1; visibility: visible; }

#selector-video-wrapper { display: none; position: absolute; left: 48px; top: 0; background: rgba(0, 0, 0, 0.9); padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-direction: column; gap: 8px; min-width: 200px; z-index: 5001; }
#selector-video { padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; }
#input-archivo-oculto { display: none; }

.btn-accion-menu { color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; text-align: center; }
#btn-agregar-archivo { background: #1b4d3e; }
#btn-agregar-archivo:hover { background: #28a745; }
#btn-borrar-item { background: #6c2222; }
#btn-borrar-item:hover { background: #a72828; }

#panel-escala { display: none; position: absolute; top: 70px; left: 20px; background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 8px; z-index: 5000; color: white; font-size: 12px; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
#slider-escala { width: 100px; cursor: pointer; }

#btn-color { position: absolute; top: 20px; right: 20px; width: 25px; height: 25px; border-radius: 50%; background-color: #00ff00; cursor: pointer; z-index: 5000; opacity: 0.4; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.8); transition: opacity 0.2s; display: block; }
#menu-colores { display: none; position: absolute; top: 55px; right: 20px; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; z-index: 5001; flex-direction: column; gap: 12px; }
.opcion-color { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }

#video-camara { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background-color: #000; }
#video-multimedia, #imagen-fuente-oculta { display: none; }

#capa-efecto-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; justify-content: center; align-items: center; }
#canvas-overlay { width: 80%; max-width: 600px; height: auto; object-fit: contain; pointer-events: auto; touch-action: none; cursor: grab; }
#canvas-overlay:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="pantalla-inicio">
    <button id="btn-iniciar">TOCA AQUÍ PARA INICIAR</button>
    <p id="mensaje-error"></p>
</div>

<div id="contenedor-principal">
    <div id="panel-controles">
        <div id="btn-menu-circular" class="btn-flotante">
            <span id="tooltip-texto">Menú de Efectos</span>
            <div id="selector-video-wrapper">
                <select id="selector-video"></select>
                <button id="btn-agregar-archivo" class="btn-accion-menu">➕ Agregar archivo local</button>
                <button id="btn-borrar-item" class="btn-accion-menu">🗑️ Borrar seleccionado</button>
            </div>
        </div>
        <div id="btn-mover-efecto" class="btn-flotante" title="Mover y Escalar Efecto"></div>
        <!-- Botón de Grabación -->
        <div id="btn-grabar" title="Grabar Video"></div>
    </div>

    <div id="panel-escala">
        <span>Zoom:</span>
        <input type="range" id="slider-escala" min="0.3" max="2.5" step="0.05" value="1">
    </div>

    <input type="file" id="input-archivo-oculto" accept="video/mp4,image/gif,image/webp">

    <div id="btn-color"></div>
    <div id="menu-colores">
        <div class="opcion-color" data-color="verde" style="background-color: #00ff00;"></div>
        <div class="opcion-color" data-color="azul" style="background-color: #0000ff;"></div>
        <div class="opcion-color" data-color="negro" style="background-color: #111; border: 1px solid #777;"></div>
    </div>

    <video id="video-camara" autoplay playsinline muted></video>
    <video id="video-multimedia" loop playsinline crossorigin="anonymous"></video>
    <img id="imagen-fuente-oculta" crossorigin="anonymous">
    
    <div id="capa-efecto-container">
        <canvas id="canvas-overlay"></canvas>
    </div>
</div>

<script>
const MULTIMEDIA_DEFAULT = [{ nombre: "Video Chroma: La Llorona", archivo: "llorona.mp4", tipo: "video" }];

function obtenerBaseDatos() {
    const guardado = localStorage.getItem('efectos_ar_db');
    if (guardado) {
        try { const parsed = JSON.parse(guardado); return parsed.length > 0 ? parsed : MULTIMEDIA_DEFAULT; } 
        catch(e) { return MULTIMEDIA_DEFAULT; }
    }
    return MULTIMEDIA_DEFAULT;
}

function guardarBaseDatos(db) { localStorage.setItem('efectos_ar_db', JSON.stringify(db)); }
let listaMultimedia = obtenerBaseDatos();

const videoCamara = document.getElementById('video-camara');
const videoMultimedia = document.getElementById('video-multimedia');
const imagenFuenteOculta = document.getElementById('imagen-fuente-oculta');
const canvas = document.getElementById('canvas-overlay');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const btnIniciar = document.getElementById('btn-iniciar');
const pantallaInicio = document.getElementById('pantalla-inicio');
const panelControles = document.getElementById('panel-controles');
const selectorVideo = document.getElementById('selector-video');
const mensajeError = document.getElementById('mensaje-error');

const btnMenuCircular = document.getElementById('btn-menu-circular');
const selectorVideoWrapper = document.getElementById('selector-video-wrapper');
const btnAgregarArchivo = document.getElementById('btn-agregar-archivo');
const btnBorrarItem = document.getElementById('btn-borrar-item');
const inputArchivoOculto = document.getElementById('input-archivo-oculto');
const btnMoverEfecto = document.getElementById('btn-mover-efecto');
const btnGrabar = document.getElementById('btn-grabar');
const panelEscala = document.getElementById('panel-escala');
const sliderEscala = document.getElementById('slider-escala');

const btnColor = document.getElementById('btn-color');
const menuColores = document.getElementById('menu-colores');
const opcionesColor = document.querySelectorAll('.opcion-color');

let colorFiltro = 'verde';
let procesando = false;
let tipoActual = 'video';
let animacionGifId = null;

let modoMoverActivo = false;
let posX = 0, posY = 0, escalaActual = 1;
let arrastrando = false;
let startX = 0, startY = 0;

// Variables para la grabación de video
let mediaRecorder;
let fragmentosVideo = [];
let estaGrabando = false;

function actualizarSelect() {
    selectorVideo.innerHTML = "";
    listaMultimedia.forEach((item) => {
        let option = document.createElement('option');
        option.value = item.archivo;
        option.setAttribute('data-tipo', item.tipo);
        option.innerText = item.nombre;
        selectorVideo.appendChild(option);
    });
}

btnMenuCircular.addEventListener('click', (e) => {
    e.stopPropagation();
    const estaVisible = selectorVideoWrapper.style.display === 'flex';
    selectorVideoWrapper.style.display = estaVisible ? 'none' : 'flex';
    btnMenuCircular.classList.toggle('activo-tactil', !estaVisible);
});

document.addEventListener('click', () => {
    selectorVideoWrapper.style.display = 'none';
    btnMenuCircular.classList.remove('activo-tactil');
    menuColores.style.display = 'none';
    btnColor.style.opacity = '0.4';
});

selectorVideoWrapper.addEventListener('click', (e) => e.stopPropagation());
btnAgregarArchivo.addEventListener('click', (e) => { e.stopPropagation(); inputArchivoOculto.click(); });

btnBorrarItem.addEventListener('click', (e) => {
    e.stopPropagation();
    const indexSeleccionado = selectorVideo.selectedIndex;
    if (listaMultimedia.length <= 1) { alert("No puedes borrar el último elemento predeterminado."); return; }
    if (indexSeleccionado >= 0) {
        if (confirm(`¿Deseas eliminar este efecto?`)) {
            listaMultimedia.splice(indexSeleccionado, 1);
            guardarBaseDatos(listaMultimedia);
            actualizarSelect();
            selectorVideo.selectedIndex = 0;
            cargarArchivoSeleccionado();
            selectorVideoWrapper.style.display = 'none';
        }
    }
});

inputArchivoOculto.addEventListener('change', (e) => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const nombreArchivo = archivo.name;
    const esGif = nombreArchivo.toLowerCase().endsWith('.gif') || archivo.type === 'image/gif';
    const tipoDetectado = esGif ? 'gif' : 'video';
    let descripcionCustom = prompt("Escribe el nombre descriptivo para este efecto:", nombreArchivo);
    if (!descripcionCustom || descripcionCustom.trim() === "") descripcionCustom = nombreArchivo;

    const urlLocal = URL.createObjectURL(archivo);
    listaMultimedia.push({ nombre: descripcionCustom, archivo: urlLocal, tipo: tipoDetectado });
    guardarBaseDatos(listaMultimedia);
    actualizarSelect();
    selectorVideo.selectedIndex = selectorVideo.options.length - 1;
    cargarArchivoSeleccionado();
    selectorVideoWrapper.style.display = 'none';
});

btnMoverEfecto.addEventListener('click', (e) => {
    e.stopPropagation();
    modoMoverActivo = !modoMoverActivo;
    btnMoverEfecto.classList.toggle('activo', modoMoverActivo);
    panelEscala.style.display = modoMoverActivo ? 'flex' : 'none';
});

sliderEscala.addEventListener('input', (e) => {
    escalaActual = parseFloat(e.target.value);
    aplicarTransformacion();
});

function aplicarTransformacion() {
    canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${escalaActual})`;
}

['mousedown', 'touchstart'].forEach(evt => {
    canvas.addEventListener(evt, (e) => {
        if (!modoMoverActivo) return;
        arrastrando = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - posX;
        startY = clientY - posY;
        e.preventDefault();
    });
});

['mousemove', 'touchmove'].forEach(evt => {
    window.addEventListener(evt, (e) => {
        if (!arrastrando || !modoMoverActivo) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        posX = clientX - startX;
        posY = clientY - startY;
        aplicarTransformacion();
    });
});

['mouseup', 'touchend'].forEach(evt => {
    window.addEventListener(evt, () => { arrastrando = false; });
});

// Lógica de Grabación de Pantalla (Cámara + Efecto combinado)
btnGrabar.addEventListener('click', () => {
    if (!estaGrabando) {
        iniciarGrabacion();
    } else {
        detenerGrabacion();
    }
});

function iniciarGrabacion() {
    fragmentosVideo = [];
    // Captura el flujo combinado de la pantalla principal (canvas y cámara)
    const streamCanvas = canvas.captureStream(30); 
    const streamCamara = videoCamara.srcObject;
    
    // Unimos los tracks de video y audio si están disponibles
    const tracksCombinados = [...streamCamara.getVideoTracks(), ...streamCanvas.getVideoTracks()];
    if (videoMultimedia.srcObject && videoMultimedia.srcObject.getAudioTracks().length > 0) {
        tracksCombinados.push(...videoMultimedia.srcObject.getAudioTracks());
    }

    const streamFinal = new MediaStream(tracksCombinados);

    try {
        mediaRecorder = new MediaRecorder(streamFinal, { mimeType: 'video/webm; codecs=vp9' });
    } catch (e) {
        try {
            mediaRecorder = new MediaRecorder(streamFinal, { mimeType: 'video/mp4' });
        } catch (err) {
            mediaRecorder = new MediaRecorder(streamFinal);
        }
    }

    mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
            fragmentosVideo.push(event.data);
        }
    };

    mediaRecorder.onstop = () => {
        const blob = new Blob(fragmentosVideo, { type: 'video/webm' });
        const urlBlob = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = urlBlob;
        a.download = `EstudioAR_${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(urlBlob);
        }, 100);
    };

    mediaRecorder.start();
    estaGrabando = true;
    btnGrabar.classList.add('grabando');
}

function detenerGrabacion() {
    if (mediaRecorder && estaGrabando) {
        mediaRecorder.stop();
        estaGrabando = false;
        btnGrabar.classList.remove('grabando');
    }
}

btnColor.addEventListener('click', (e) => {
    e.stopPropagation();
    const estaAbierto = menuColores.style.display === 'flex';
    menuColores.style.display = estaAbierto ? 'none' : 'flex';
    btnColor.style.opacity = estaAbierto ? '0.4' : '1';
});

opcionesColor.forEach(opcion => {
    opcion.addEventListener('click', (e) => {
        colorFiltro = e.target.getAttribute('data-color');
        btnColor.style.backgroundColor = getComputedStyle(e.target).backgroundColor;
        menuColores.style.display = 'none';
        btnColor.style.opacity = '0.4';
    });
});

function cargarArchivoSeleccionado() {
    if (selectorVideo.options.length === 0) return;
    const selectedOption = selectorVideo.options[selectorVideo.selectedIndex];
    const archivoUrl = selectedOption.value;
    tipoActual = selectedOption.getAttribute('data-tipo');

    posX = 0; posY = 0; escalaActual = 1; sliderEscala.value = 1;
    if (modoMoverActivo) { btnMoverEfecto.click(); }
    if (animacionGifId) { cancelAnimationFrame(animacionGifId); animacionGifId = null; }

    if (tipoActual === 'gif') {
        videoMultimedia.pause();
        btnColor.style.display = 'block';
        
        imagenFuenteOculta.src = archivoUrl;
        imagenFuenteOculta.onload = () => {
            canvas.width = imagenFuenteOculta.naturalWidth || 500;
            canvas.height = imagenFuenteOculta.naturalHeight || 500;
            aplicarTransformacion();
            procesarChromaKeyGIF();
        };
    } else {
        imagenFuenteOculta.src = "";
        btnColor.style.display = 'block';
        videoMultimedia.src = archivoUrl;
        videoMultimedia.muted = false;
        videoMultimedia.play().catch(() => {});
    }
}

selectorVideo.addEventListener('change', cargarArchivoSeleccionado);

async function iniciarExperiencia() {
    mensajeError.innerText = "Solicitando permisos de cámara...";
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true 
        });
        videoCamara.srcObject = stream;
        videoCamara.onloadedmetadata = () => {
            videoCamara.play();
            pantallaInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            actualizarSelect();
            cargarArchivoSeleccionado();
        };
    } catch (err) {
        mensajeError.innerText = "Error: No se pudo acceder a la cámara o permisos denegados.";
    }
}

videoMultimedia.addEventListener('loadedmetadata', () => {
    canvas.width = videoMultimedia.videoWidth;
    canvas.height = videoMultimedia.videoHeight;
    aplicarTransformacion();
    if (!procesando) {
        procesando = true;
        procesarChromaKeyVideo();
    }
});

function procesarChromaKeyVideo() {
    if (tipoActual === 'video' && !videoMultimedia.paused && !videoMultimedia.ended) {
        ctx.drawImage(videoMultimedia, 0, 0, canvas.width, canvas.height);
        let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let totalPixeles = frame.data.length / 4;

        for (let i = 0; i < totalPixeles; i++) {
            let r = frame.data[i * 4 + 0];
            let g = frame.data[i * 4 + 1];
            let b = frame.data[i * 4 + 2];

            if (colorFiltro === 'verde') {
                if (g > 90 && r < 110 && b < 110) frame.data[i * 4 + 3] = 0;
            } else if (colorFiltro === 'azul') {
                if (b > 90 && r < 110 && g < 110) frame.data[i * 4 + 3] = 0;
            } else if (colorFiltro === 'negro') {
                if (r < 50 && g < 50 && b < 50) frame.data[i * 4 + 3] = 0;
            }
        }
        ctx.putImageData(frame, 0, 0);
    }
    requestAnimationFrame(procesarChromaKeyVideo);
}

function procesarChromaKeyGIF() {
    if (tipoActual === 'gif') {
        ctx.drawImage(imagenFuenteOculta, 0, 0, canvas.width, canvas.height);
        let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let totalPixeles = frame.data.length / 4;

        for (let i = 0; i < totalPixeles; i++) {
            let r = frame.data[i * 4 + 0];
            let g = frame.data[i * 4 + 1];
            let b = frame.data[i * 4 + 2];

            if (colorFiltro === 'verde') {
                if (g > 90 && r < 110 && g < 110) frame.data[i * 4 + 3] = 0;
            } else if (colorFiltro === 'azul') {
                if (b > 90 && r < 110 && g < 110) frame.data[i * 4 + 3] = 0;
            } else if (colorFictio === 'negro' || colorFiltro === 'negro') {
                if (r < 50 && g < 50 && b < 50) frame.data[i * 4 + 3] = 0;
            }
        }
        ctx.putImageData(frame, 0, 0);
        animacionGifId = requestAnimationFrame(procesarChromaKeyGIF);
    }
}

btnIniciar.addEventListener('click', iniciarExperiencia);
</script>
</body>
</html>
